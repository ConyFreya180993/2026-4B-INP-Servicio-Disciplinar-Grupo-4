spring.application.name=peluditos-webservice

# Conexion a MariaDB
spring.datasource.url=${PELUDITOS_DB_URL:jdbc:mariadb://127.0.0.1:3306/peluditos_db}
spring.datasource.username=${PELUDITOS_DB_USER:peluditos_app}
spring.datasource.password=${PELUDITOS_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion de Jersey
spring.jersey.type=filter
spring.jersey.application-path=${PELUDITOS_JERSEY_PATH:/jakarta}

# Puerto de la aplicacion
server.port=${PELUDITOS_SERVER_PORT:8080}
